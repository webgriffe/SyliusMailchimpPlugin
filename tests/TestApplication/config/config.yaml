imports:
    - { resource: "@WebgriffeSyliusMailchimpPlugin/config/config.yaml" }
    - { resource: "services_test.php" }

twig:
    paths:
        '%kernel.project_dir%/../../../tests/TestApplication/templates': ~


sylius_channel:
    resources:
        channel:
            classes:
                model: Tests\Webgriffe\SyliusMailchimpPlugin\Entity\Channel\Channel

sylius_customer:
    resources:
        customer:
            classes:
                model: Tests\Webgriffe\SyliusMailchimpPlugin\Entity\Customer\Customer
                repository: Tests\Webgriffe\SyliusMailchimpPlugin\Repository\CustomerRepository

sylius_product:
    resources:
        product:
            classes:
                repository: Tests\Webgriffe\SyliusMailchimpPlugin\Repository\ProductRepository

sylius_order:
    resources:
        order:
            classes:
                model: Tests\Webgriffe\SyliusMailchimpPlugin\Entity\Order\Order
                repository: Tests\Webgriffe\SyliusMailchimpPlugin\Repository\OrderRepository


# Remove if you do not need to extend entities
doctrine:
    orm:
        entity_managers:
            default:
                mappings:
                    TestApplication:
                        is_bundle: false
                        type: attribute
                        dir: '%kernel.project_dir%/../../../tests/TestApplication/src/Entity'
                        prefix: Tests\Webgriffe\SyliusMailchimpPlugin
