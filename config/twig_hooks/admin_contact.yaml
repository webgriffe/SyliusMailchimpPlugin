sylius_twig_hooks:
    hooks:
        'webgriffe_sylius_mailchimp.contact.show':
            sidebar:
                template: '@SyliusAdmin/shared/crud/common/sidebar.html.twig'
                priority: 200
            navbar:
                template: '@SyliusAdmin/shared/crud/common/navbar.html.twig'
                priority: 100
            content:
                template: '@WebgriffeSyliusMailchimp/admin/contact/show/content.html.twig'
                priority: 0

        'webgriffe_sylius_mailchimp.contact.index.content.header.title_block':
            title:
                template: '@WebgriffeSyliusMailchimp/admin/contact/index/header/title.html.twig'
                priority: 0
