webgriffe_sylius_mailchimp_webhook:
    path: /mailchimp/webhook
    controller: Webgriffe\SyliusMailchimpPlugin\Controller\WebhookController
    methods: [GET, POST]

webgriffe_sylius_mailchimp_contact_index:
    path: /mailchimp/contacts
    methods: [GET]
    defaults:
        _controller: sylius.controller.customer::indexAction
        _sylius:
            section: admin
            permission: true
            template: "@SyliusAdmin/shared/crud/index.html.twig"
            grid: webgriffe_sylius_mailchimp_contact
            vars:
                hook_prefix: 'webgriffe_sylius_mailchimp.contact'

webgriffe_sylius_mailchimp_contact_show:
    path: /mailchimp/contacts/{id}
    methods: [GET]
    defaults:
        _controller: Webgriffe\SyliusMailchimpPlugin\Controller\Admin\ContactController::showAction
