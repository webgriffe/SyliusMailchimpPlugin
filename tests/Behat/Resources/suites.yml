                - sylius.behat.context.transform.payment

                - sylius.behat.context.ui.shop.locale
                - sylius.behat.context.ui.shop.checkout.complete
                - sylius.behat.context.ui.shop.checkout.thank_you

                - Tests\Webgriffe\SyliusMailchimpPlugin\Behat\Context\Setup\MailchimpChannelContext
                - Tests\Webgriffe\SyliusMailchimpPlugin\Behat\Context\Ui\Shop\MailchimpOrderContext
            filters:
                tags: "@mailchimp&&@order"
