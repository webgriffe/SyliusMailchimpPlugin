default:
    suites:
        webgriffe_mailchimp_registering:
            contexts:
                - sylius.behat.context.hook.doctrine_orm
                - sylius.behat.context.hook.session
                - sylius.behat.context.setup.channel
                - sylius.behat.context.setup.locale
                - sylius.behat.context.setup.user
                - sylius.behat.context.setup.shop_security

                - sylius.behat.context.transform.shared_storage
                - sylius.behat.context.transform.lexical

                - sylius.behat.context.ui.shop.locale
                - sylius.behat.context.ui.shop.registration

                - Tests\Webgriffe\SyliusMailchimpPlugin\Behat\Context\Setup\MailchimpChannelContext
                - Tests\Webgriffe\SyliusMailchimpPlugin\Behat\Context\Ui\Shop\MailchimpRegistrationContext
            filters:
                tags: "@mailchimp&&@registering"

        webgriffe_mailchimp_cart:
            contexts:
                - sylius.behat.context.hook.doctrine_orm
                - sylius.behat.context.hook.session
                - sylius.behat.context.setup.channel
                - sylius.behat.context.setup.locale
                - sylius.behat.context.setup.product

                - sylius.behat.context.transform.shared_storage
                - sylius.behat.context.transform.product
                - sylius.behat.context.transform.lexical

                - sylius.behat.context.ui.shop.locale
                - sylius.behat.context.ui.shop.cart

                - Tests\Webgriffe\SyliusMailchimpPlugin\Behat\Context\Setup\MailchimpChannelContext
                - Tests\Webgriffe\SyliusMailchimpPlugin\Behat\Context\Ui\Shop\MailchimpCartContext
            filters:
                tags: "@mailchimp&&@cart"

        webgriffe_mailchimp_order:
            contexts:
                - sylius.behat.context.hook.doctrine_orm
                - sylius.behat.context.hook.session
                - sylius.behat.context.setup.channel
                - sylius.behat.context.setup.locale
                - sylius.behat.context.setup.product
                - sylius.behat.context.setup.user
                - sylius.behat.context.setup.shop_security
                - sylius.behat.context.setup.cart
